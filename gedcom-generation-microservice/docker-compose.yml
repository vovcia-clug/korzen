version: '3.8'

services:
  # GEDCOM Generation Service
  gedcom-generation:
    build: .
    container_name: gedcom-generation-service
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - gedcom-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gedcom-network:
    driver: bridge
