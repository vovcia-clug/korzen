version: '3.8'

services:
  ocr-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-microservice
    restart: unless-stopped
    
    environment:
      # AWS Configuration
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      
      # SQS Configuration
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - SQS_MAX_MESSAGES=${SQS_MAX_MESSAGES:-1}
      - SQS_WAIT_TIME_SECONDS=${SQS_WAIT_TIME_SECONDS:-20}
      - SQS_VISIBILITY_TIMEOUT=${SQS_VISIBILITY_TIMEOUT:-300}
      
      # S3 Configuration
      - S3_INPUT_BUCKET=${S3_INPUT_BUCKET}
      - S3_OUTPUT_BUCKET=${S3_OUTPUT_BUCKET}
      - S3_OUTPUT_PREFIX=${S3_OUTPUT_PREFIX:-ocr-results/}
      
      # Application Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEMP_DIR=${TEMP_DIR:-/tmp/ocr-processing}
      
      # Retry Configuration
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_BACKOFF_BASE=${RETRY_BACKOFF_BASE:-2.0}
      - RETRY_BACKOFF_MAX=${RETRY_BACKOFF_MAX:-60.0}
      
      # OCR Configuration
      - OCR_OUTPUT_FORMAT=${OCR_OUTPUT_FORMAT:-markdown}
      - OCR_MODE=${OCR_MODE:-balanced}
      - OCR_PAGINATE=${OCR_PAGINATE:-true}
    
    volumes:
      # Mount temp directory for persistent storage (optional)
      - ocr-temp:/tmp/ocr-processing
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ocr-temp:
    driver: local
