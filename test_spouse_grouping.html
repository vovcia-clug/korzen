<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Spouse Grouping Algorithm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        .test-case {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .test-case h3 {
            margin-top: 0;
            color: #1976d2;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-left: 4px solid #4caf50;
        }
        .error {
            border-left-color: #f44336;
        }
        pre {
            background: #263238;
            color: #aed581;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Spouse Grouping Algorithm Test</h1>
    <p>Testing the custom hierarchical level calculation with spouse grouping.</p>
    
    <div id="test-results"></div>

    <script>
        // Copy the calculateHierarchicalLevels function from graph.js
        function calculateHierarchicalLevels(nodes, edges) {
            const nodeMap = new Map();
            const levels = new Map();
            const marriages = new Map();
            
            nodes.forEach(node => {
                nodeMap.set(node.id, node);
            });
            
            edges.forEach(edge => {
                if (edge.type === 'MARRIED_TO') {
                    if (!marriages.has(edge.from)) {
                        marriages.set(edge.from, []);
                    }
                    if (!marriages.has(edge.to)) {
                        marriages.set(edge.to, []);
                    }
                    marriages.get(edge.from).push(edge.to);
                    marriages.get(edge.to).push(edge.from);
                }
            });
            
            const hasParent = new Set();
            edges.forEach(edge => {
                if (edge.type === 'PARENT_OF') {
                    hasParent.add(edge.to);
                }
            });
            
            const roots = nodes.filter(node => !hasParent.has(node.id));
            
            const queue = [];
            const visited = new Set();
            
            roots.forEach(root => {
                queue.push({ id: root.id, level: 0 });
            });
            
            while (queue.length > 0) {
                const { id, level } = queue.shift();
                
                if (visited.has(id)) {
                    const existingLevel = levels.get(id);
                    if (existingLevel !== undefined && existingLevel !== level) {
                        const minLevel = Math.min(existingLevel, level);
                        levels.set(id, minLevel);
                        
                        if (marriages.has(id)) {
                            marriages.get(id).forEach(spouseId => {
                                if (levels.get(spouseId) !== minLevel) {
                                    levels.set(spouseId, minLevel);
                                    edges.forEach(edge => {
                                        if (edge.type === 'PARENT_OF' && edge.from === spouseId) {
                                            queue.push({ id: edge.to, level: minLevel + 1 });
                                        }
                                    });
                                }
                            });
                        }
                    }
                    continue;
                }
                
                visited.add(id);
                levels.set(id, level);
                
                if (marriages.has(id)) {
                    marriages.get(id).forEach(spouseId => {
                        if (!visited.has(spouseId)) {
                            levels.set(spouseId, level);
                            visited.add(spouseId);
                            
                            edges.forEach(edge => {
                                if (edge.type === 'PARENT_OF' && edge.from === spouseId) {
                                    queue.push({ id: edge.to, level: level + 1 });
                                }
                            });
                        }
                    });
                }
                
                edges.forEach(edge => {
                    if (edge.type === 'PARENT_OF' && edge.from === id) {
                        queue.push({ id: edge.to, level: level + 1 });
                    }
                });
            }
            
            nodes.forEach(node => {
                if (!levels.has(node.id)) {
                    levels.set(node.id, 0);
                }
            });
            
            return levels;
        }

        // Test cases
        const testCases = [
            {
                name: "Simple Family - One Married Couple with Children",
                nodes: [
                    { id: 'john', label: 'John Smith' },
                    { id: 'mary', label: 'Mary Jones' },
                    { id: 'child1', label: 'Alice Smith' },
                    { id: 'child2', label: 'Bob Smith' }
                ],
                edges: [
                    { from: 'john', to: 'mary', type: 'MARRIED_TO' },
                    { from: 'john', to: 'child1', type: 'PARENT_OF' },
                    { from: 'john', to: 'child2', type: 'PARENT_OF' },
                    { from: 'mary', to: 'child1', type: 'PARENT_OF' },
                    { from: 'mary', to: 'child2', type: 'PARENT_OF' }
                ],
                expected: {
                    john: 0,
                    mary: 0,  // Same level as John
                    child1: 1,
                    child2: 1
                }
            },
            {
                name: "Three Generations",
                nodes: [
                    { id: 'grandpa', label: 'Grandpa' },
                    { id: 'grandma', label: 'Grandma' },
                    { id: 'father', label: 'Father' },
                    { id: 'mother', label: 'Mother' },
                    { id: 'child', label: 'Child' }
                ],
                edges: [
                    { from: 'grandpa', to: 'grandma', type: 'MARRIED_TO' },
                    { from: 'grandpa', to: 'father', type: 'PARENT_OF' },
                    { from: 'grandma', to: 'father', type: 'PARENT_OF' },
                    { from: 'father', to: 'mother', type: 'MARRIED_TO' },
                    { from: 'father', to: 'child', type: 'PARENT_OF' },
                    { from: 'mother', to: 'child', type: 'PARENT_OF' }
                ],
                expected: {
                    grandpa: 0,
                    grandma: 0,
                    father: 1,
                    mother: 1,  // Same level as Father
                    child: 2
                }
            },
            {
                name: "Multiple Marriages",
                nodes: [
                    { id: 'john', label: 'John' },
                    { id: 'mary', label: 'Mary (1st wife)' },
                    { id: 'jane', label: 'Jane (2nd wife)' },
                    { id: 'child1', label: 'Child from 1st marriage' },
                    { id: 'child2', label: 'Child from 2nd marriage' }
                ],
                edges: [
                    { from: 'john', to: 'mary', type: 'MARRIED_TO' },
                    { from: 'john', to: 'jane', type: 'MARRIED_TO' },
                    { from: 'john', to: 'child1', type: 'PARENT_OF' },
                    { from: 'mary', to: 'child1', type: 'PARENT_OF' },
                    { from: 'john', to: 'child2', type: 'PARENT_OF' },
                    { from: 'jane', to: 'child2', type: 'PARENT_OF' }
                ],
                expected: {
                    john: 0,
                    mary: 0,  // Same level as John
                    jane: 0,  // Same level as John
                    child1: 1,
                    child2: 1
                }
            }
        ];

        // Run tests
        const resultsDiv = document.getElementById('test-results');
        
        testCases.forEach((testCase, index) => {
            const testDiv = document.createElement('div');
            testDiv.className = 'test-case';
            
            const title = document.createElement('h3');
            title.textContent = `Test ${index + 1}: ${testCase.name}`;
            testDiv.appendChild(title);
            
            try {
                const levels = calculateHierarchicalLevels(testCase.nodes, testCase.edges);
                
                // Check if results match expected
                let passed = true;
                let details = [];
                
                for (const [nodeId, expectedLevel] of Object.entries(testCase.expected)) {
                    const actualLevel = levels.get(nodeId);
                    const match = actualLevel === expectedLevel;
                    passed = passed && match;
                    
                    const node = testCase.nodes.find(n => n.id === nodeId);
                    details.push(`${node.label}: Level ${actualLevel} ${match ? '✓' : `✗ (expected ${expectedLevel})`}`);
                }
                
                const resultDiv = document.createElement('div');
                resultDiv.className = passed ? 'result' : 'result error';
                resultDiv.innerHTML = `
                    <strong>${passed ? '✓ PASSED' : '✗ FAILED'}</strong>
                    <pre>${details.join('\n')}</pre>
                `;
                testDiv.appendChild(resultDiv);
                
            } catch (error) {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>✗ ERROR</strong>
                    <pre>${error.message}\n${error.stack}</pre>
                `;
                testDiv.appendChild(resultDiv);
            }
            
            resultsDiv.appendChild(testDiv);
        });
    </script>
</body>
</html>
